<VirtualHost *:8443>
    # TLS terminates HERE, not at untrusted forwarded headers.
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /run/chrono-tls/certificate.pem
    SSLCertificateKeyFile /run/chrono-tls/private-key.pem
    UseCanonicalName Off
    DocumentRoot /opt/chrono/framework/public
    DirectoryIndex index.php
    AllowEncodedSlashes Off
    # Server-context rewrite runs before file authorization: route-like legacy
    # URLs reach index.php; an actual second PHP file can never execute.
    RewriteEngine On
    RewriteRule "(^|/)\." - [F]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteRule ^ /index.php [END]
    LimitRequestBody 1048576
    RequestReadTimeout handshake=10 header=10-20,MinRate=500 body=10-30,MinRate=500
    TimeOut 60
    # These I/O/CPU limits are NOT a whole-request wall-clock ceiling.
    # Deliberately no request access logs (query/body may contain private data).
    CustomLog /dev/null combined
    ErrorLog /proc/self/fd/2
    LogLevel warn
    <Directory /opt/chrono>
        AllowOverride None
        Options None
        Require all denied
    </Directory>
    <Directory /opt/chrono/framework/public>
        AllowOverride None
        Options None
        Require all granted
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        # Only this one entry point can execute. Legacy .php URLs that are not
        # files still reach Laravel through the server rewrite, not native PHP.
        <FilesMatch "^(?!index\.php$).*\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    Header always set X-Content-Type-Options nosniff
</VirtualHost>
