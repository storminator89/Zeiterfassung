expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
allow_url_include = Off
file_uploads = Off
memory_limit = 256M
max_execution_time = 30
max_input_time = 30
post_max_size = 1M
; CPU/input limits do not bound blocking I/O or establish the session-lock gate.
