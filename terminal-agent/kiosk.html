<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="kiosk-token" content="__CSRF__"><title>Chrono · Praxis-Terminal</title><link rel="stylesheet" href="/kiosk.css"></head><body><main><header><strong>◷ Chrono</strong><span>PRAXIS-TERMINAL</span></header><div id="clock" class="clock" aria-hidden="true"></div><p id="date"></p><section id="login"><h1>Guten Tag.</h1><p>Chip vorhalten oder Personalcode eingeben.<br>Danach mit Ihrer persönlichen PIN bestätigen.</p><form id="identify"><label for="card">NFC-Chip</label><input id="card" name="card" autocomplete="off" autofocus placeholder="Chip am Leser vorhalten"><label for="employee_code">Alternativ: Personalcode</label><input id="employee_code" name="employee_code" autocomplete="off"><label for="pin">PIN · 8 Ziffern</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required><button>Anmelden</button></form></section><section id="person" hidden><h1 id="name"></h1><p id="state"></p><div id="actions"><button data-action="start">Kommen</button><button data-action="pause_start">Pause beginnen</button><button data-action="pause_end">Pause beenden</button><button data-action="end">Gehen</button></div><label id="confirm-box" hidden><input id="confirm" type="checkbox"> Aktive Pause beim Gehen ebenfalls beenden</label><button id="cancel" class="quiet">Abbrechen</button></section><p id="message" role="status" aria-live="polite"></p><footer>Nur eine Serverbestätigung gilt als Buchung.<br>Bei Verbindungsausfall bitte den vereinbarten Ersatzweg nutzen.</footer></main><script src="/kiosk.js"></script></body></html>
